services:
  broker:
    image: eclipse-mosquitto:2
    container_name: sentinel-broker
    volumes:
      - ../communication/broker-config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
      - "9001:9001"

  backend:
    image: python:3.10-slim
    container_name: sentinel-backend
    working_dir: /app
    volumes:
      - ..:/app
    env_file:
      - ../.env
    command: sh -c "python scripts/test_subscriber.py"
    depends_on:
      - broker

  dashboard:
    image: nginx:alpine
    container_name: sentinel-dashboard
    volumes:
      - ../dashboard/frontend:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    depends_on:
      - backend
